<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Który tramwaj</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#14213d;--mut:#6b7280;--line:#e5e7eb;--acc:#fca311}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:1000;background:var(--ink);color:#fff;padding:8px 10px;display:flex;align-items:center;gap:8px}
  header h1{font-size:15px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{display:flex;gap:4px}
  .tabs button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:5px 9px;font-size:14px}
  #infoCount{display:inline-block;margin-left:3px;font-size:12px;font-weight:700}
  #infoView{overflow:auto;padding:8px}
  .alert{background:#fff;border-radius:10px;margin-bottom:8px;padding:10px;border-left:5px solid var(--acc)}
  .alert.now{border-left-color:#d62828}
  .alert h3{font-size:15px;margin:6px 0 2px;line-height:1.3}
  .alert .lns{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .alert .lns .ln{min-width:26px;font-size:12px;padding:2px 5px}
  .alert .kind{font-size:11px;font-weight:700;text-transform:none;color:#d62828;margin-left:4px}
  .alert.route .kind{color:#b45309}
  .alert .meta{font-size:12px;color:var(--mut)}
  .alert .body{display:none;font-size:14px;line-height:1.45;margin-top:6px}
  .alert .body p{margin:0 0 6px}
  .alert.open .body{display:block}
  .alert.old{opacity:.6}
  .alert a{color:#1d4ed8}
  .sect{font-size:12px;font-weight:700;color:var(--mut);margin:10px 2px 6px;text-transform:uppercase;letter-spacing:.03em}
  .sect:first-child{margin-top:2px}
  .okline{background:#e7f6ec;color:#166534;border-radius:8px;padding:8px 10px;font-size:13px}
  .tabs button.hot{background:#d62828;border-color:#d62828}
  .stopAlert.now{background:#fde2e2;border-color:#f5a3a3;color:#7f1d1d}
  .stopAlert{background:#fff4d6;border:1px solid #fcd34d;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px}
  .tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
  main{height:calc(100% - 46px - 22px)}
  section{display:none;height:100%}
  section.on{display:block}
  #stopView{overflow:auto;padding:8px}
  .row{display:flex;gap:6px;align-items:center}
  input[type=search]{flex:1;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  .chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 9px;font-size:13px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .list{background:var(--card);border-radius:10px;overflow:hidden;margin-top:6px}
  .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
  .item:last-child{border-bottom:0}
  .ln{min-width:34px;text-align:center;font-weight:700;background:var(--ink);color:#fff;border-radius:5px;padding:3px 4px;font-size:14px}
  .ln.bus{background:#5b6170}
  .hd{flex:1;min-width:0}
  .hd b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .hd small{color:var(--mut)}
  .tm{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .tm small{display:block;font-weight:400;color:var(--mut);font-size:11px}
  .mdl{display:inline-block;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:600;color:#fff;margin-right:4px}
  .star{background:none;border:0;font-size:20px;color:var(--acc);padding:0 4px}
  .muted{color:var(--mut);font-size:13px;padding:8px 2px}
  .err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px;font-size:13px;margin:6px 0}
  #mapView{position:relative}
  /* zakładka 0,5 px między kafelkami; tryb mieszania normalny, bo domyślny w Leaflet (plus-lighter) rozjaśnia miejsce zakładki na biało */
  #map .leaflet-tile{width:256.5px !important;height:256.5px !important;mix-blend-mode:normal !important}
  #map{position:absolute;inset:0}
  #mapBar{position:absolute;z-index:500;left:6px;right:6px;top:6px;background:#ffffffee;border-radius:8px;padding:4px 6px;box-shadow:0 1px 4px #0003}
  #mapBar .chips{margin:0}
  #mapInfo{font-size:11px;color:var(--mut);margin-top:2px}
  .tram{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:1px 6px;border-radius:7px;color:#fff;font:700 13px/19px system-ui;border:2px solid #fff}
  .tram small{font:500 11px/19px system-ui;opacity:.95}
  .tram i{font-style:normal;display:inline-block;font-size:10px;line-height:10px}
  .leaflet-popup-content{margin:8px 10px;font-size:13px;line-height:1.35}
  footer{height:22px;font-size:10px;color:var(--mut);text-align:center;line-height:22px}
  dialog{border:0;border-radius:10px;max-width:92vw}
  dialog input{width:100%;font-size:14px;padding:6px;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>Który tramwaj</h1>
  <div class="tabs">
    <button id="tStop" class="on">Przystanek</button>
    <button id="tMap">Mapa</button>
    <button id="tInfo" title="Komunikaty ZTM">⚠<span id="infoCount"></span></button>
    <button id="tSet" title="Ustawienia">⚙</button>
  </div>
</header>

<main>
  <section id="stopView" class="on">
    <div class="row"><input id="q" type="search" placeholder="Szukaj przystanku…" autocomplete="off"></div>
    <div id="favs" class="chips"></div>
    <div id="results" class="list"></div>
    <div id="stopHead" class="row" style="margin-top:8px"></div>
    <div id="stopAlerts"></div>
    <div id="deps" class="list"></div>
    <div id="depInfo" class="muted"></div>
  </section>

  <section id="infoView">
    <div id="infoNow"></div>
    <div id="infoFilter" class="chips"></div>
    <div id="infoList"></div>
    <div id="infoMeta" class="muted"></div>
  </section>

  <section id="mapView">
    <div id="map"></div>
    <div id="mapBar">
      <div id="mFilter" class="chips"></div>
      <div id="mapInfo">ładowanie…</div>
    </div>
  </section>
</main>
<footer>dane: ZTM w Gdańsku (CC BY) · KA</footer>

<dialog id="dlg">
  <b>Ustawienia</b>
  <div class="muted">Adres pośrednika (proxy). Zostaw puste, jeśli dane pobierają się bez niego. Przykład: https://twoj-worker.workers.dev/?url=</div>
  <input id="proxy" placeholder="https://…/?url=">
  <div class="row" style="justify-content:flex-end"><button id="dlgOk">Zapisz</button></div>
</dialog>

<script>
const API = {
  gps: 'https://ckan2.multimediagdansk.pl/gpsPositions?v=2',
  deps: id => 'https://ckan2.multimediagdansk.pl/departures?stopId=' + id,
  fleet: 'https://files.cloudgdansk.pl/d/otwarte-dane/ztm/baza-pojazdow.json?v=2',
  bsk: 'https://files.cloudgdansk.pl/d/otwarte-dane/ztm/bsk.json',
  znt: 'https://files.cloudgdansk.pl/d/otwarte-dane/ztm/znt.json?v=1',
  stops: 'https://ckan.multimediagdansk.pl/dataset/c24aa637-3619-4dc2-a171-a23eec8f2172/resource/4c4025f0-01bf-41f7-a39f-d156d201b82b/download/stops.json'
};

// Kody fabryczne -> potoczne nazwy i kolory
const MODELS = [
  {key:'swing', name:'Swing',    color:'#2a9d8f', test:m => /120NaG/i.test(m)},
  {key:'jazz',  name:'Jazz Duo', color:'#2563eb', test:m => /128N/i.test(m)},
  {key:'n8c',   name:'N8C',      color:'#e76f51', test:m => /N8C/i.test(m)},
  {key:'ngt6',  name:'NGT6',     color:'#8e44ad', test:m => /NGT6/i.test(m)},
  {key:'ngd99', name:'NGd99',    color:'#6b7280', test:m => /NGd99/i.test(m)},
  {key:'hist',  name:'zabytkowy',color:'#8d6e63', test:(m,v) => v && v.historicVehicle},
  {key:'other', name:'inny',     color:'#374151', test:() => true},
];

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

const state = {
  fleet: {},          // vehicleCode -> pojazd
  stops: [],          // uproszczona lista przystanków
  favs: LS.get('kt_favs', []),
  stop: LS.get('kt_stop', null),
  mapModels: LS.get('kt_mapModels', MODELS.map(m => m.key)),
  proxy: LS.get('kt_proxy', ''),
};

// Publiczni pośrednicy, gdy serwer nie wpuszcza zapytań z innej strony (CORS)
const FALLBACK_PROXIES = [
  u => 'https://tramwaje.mrukboj.workers.dev/?url=' + encodeURIComponent(u),   // własny pośrednik (Cloudflare)
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];
const hostRoute = {}; // host -> 'direct' | indeks pośrednika

async function fetchJSON(u, ms = 20000){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  let r;
  try{ r = await fetch(u, {signal: ctl.signal}) }
  catch(e){ throw new Error(e.name === 'AbortError' ? 'przekroczony czas' : e.message) }
  finally{ clearTimeout(timer) }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const t = await r.text();
  if(/^\s*</.test(t)) throw new Error('odpowiedź nie jest JSON-em');
  return JSON.parse(t);
}

async function getJSON(url, ms){
  if(state.proxy) return fetchJSON(state.proxy + encodeURIComponent(url), ms);
  const key = url.split('?')[0];
  const all = ['direct', ...FALLBACK_PROXIES.map((_, i) => i)];
  const route = hostRoute[key];
  const live = url.includes('ckan2.multimediagdansk.pl');
  const first = live ? [0, 'direct'] : ['direct', 0];
  const tries = route === undefined ? [...first, ...all.filter(t => !first.includes(t))] : [route, ...all.filter(t => t !== route)];
  let lastErr;
  for(const t of tries){
    try{
      // znacznik czasu, żeby pośrednik nie podawał starej kopii z pamięci
      const fresh = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
      const data = await fetchJSON(t === 'direct' ? url : FALLBACK_PROXIES[t](fresh), ms);
      hostRoute[key] = t;
      return data;
    }catch(e){ lastErr = e }
  }
  throw lastErr;
}

function routeLabel(key){
  const r = hostRoute[key];
  return r === undefined ? '' : r === 'direct' ? ' · bezpośrednio' : r === 0 ? ' · przez własny pośrednik' : ' · przez publicznego pośrednika ' + r;
}

function corsHint(e){
  return 'Nie udało się pobrać danych (' + e.message + '). Jeśli to błąd sieci/CORS, potrzebny będzie pośrednik — ustaw go w ⚙.';
}

// ---------- baza pojazdów ----------
function classify(v){
  if(!v) return null;
  const m = v.model || '';
  return MODELS.find(x => x.test(m, v));
}
function vInfo(code){
  const v = state.fleet[String(code)];
  if(!v) return null;
  const c = classify(v);
  return {v, c, label: c.key === 'other' ? (v.model || 'nieznany') : c.name};
}

async function loadFleet(){
  const today = new Date().toISOString().slice(0,10);
  const cached = LS.get('kt_fleet', null);
  if(cached && cached.d === today){ state.fleet = cached.f; return }
  const data = await getJSON(API.fleet);
  const f = {};
  for(const v of (data.results || [])){
    f[String(v.vehicleCode)] = {
      model: v.model, brand: v.brand, year: v.productionYear,
      type: v.transportationType, seats: v.seats, stand: v.standingPlaces,
      ac: v.airConditioning, floor: v.floorHeight, historicVehicle: v.historicVehicle,
      usb: v.usb, patron: v.patron
    };
  }
  state.fleet = f;
  LS.set('kt_fleet', {d: today, f});
}

// ---------- przystanki ----------
async function loadStops(){
  const today = new Date().toISOString().slice(0,10);
  try{ localStorage.removeItem('kt_stops') }catch(e){}   // stara, mogła zapisać niepełną listę
  const cached = LS.get('kt_stops2', null);
  if(cached && cached.d === today && cached.s.length > 500){ state.stops = cached.s; return }
  try{
    const local = await fetchJSON('stops.json?d=' + today, 15000);
    if(local.stops && local.stops.length > 500){
      state.stops = local.stops;
      LS.set('kt_stops2', {d: today, s: local.stops});
      return;
    }
  }catch(e){}
  const data = await getJSON(API.stops);
  const d = new Date(), local = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const keys = Object.keys(data).filter(k => data[k] && Array.isArray(data[k].stops));
  const named = k => data[k].stops.filter(x => x.stopName).length;
  const key = keys.includes(local) && named(local) > 100 ? local : keys.sort((a,b) => named(b) - named(a))[0];
  if(!key) throw new Error('pusty plik przystanków');
  const seen = new Set(), s = [];
  for(const x of data[key].stops){
    if(!x.stopName || x.virtual || x.nonpassenger || x.depot) continue;
    if(seen.has(x.stopId)) continue;
    seen.add(x.stopId);
    s.push({id:x.stopId, n:x.stopName, c:x.stopCode || '', z:x.zoneName || '', t:x.type});
  }
  if(s.length < 500) throw new Error('niepełna lista przystanków (' + s.length + ')');
  state.stops = s;
  LS.set('kt_stops2', {d: today, s});
}

const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');

function renderResults(){
  const q = norm(document.getElementById('q').value.trim());
  const box = document.getElementById('results');
  box.innerHTML = '';
  if(q.length < 2) return;
  const hits = state.stops.filter(s => norm(s.n).includes(q))
    .sort((a,b) => (a.t==='TRAM'?0:1)-(b.t==='TRAM'?0:1) || a.n.localeCompare(b.n) || a.c.localeCompare(b.c))
    .slice(0, 30);
  if(!hits.length){
    box.innerHTML = !state.stops.length && !state.stopsErr
      ? '<div class="muted">Wczytuję listę przystanków…</div>'
      : state.stopsErr
      ? '<div class="err">Lista przystanków się nie wczytała (' + state.stopsErr + '). Spróbuję ponownie za chwilę.</div>'
      : '<div class="muted">Brak wyników' + (state.stops.length ? '' : ' — lista przystanków jest pusta') + '</div>';
    return;
  }
  for(const s of hits){
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = `<span class="ln ${s.t==='TRAM'?'':'bus'}">${s.c||'–'}</span>
      <div class="hd"><b>${s.n}</b><small>${s.t==='TRAM'?'tramwaj':'autobus'}${s.z ? ' · ' + s.z : ''}</small></div>`;
    d.onclick = () => { selectStop(s); document.getElementById('q').value=''; box.innerHTML='' };
    box.appendChild(d);
  }
}

function renderFavs(){
  const box = document.getElementById('favs');
  box.innerHTML = '';
  for(const s of state.favs){
    const b = document.createElement('button');
    b.className = 'chip' + (state.stop && state.stop.id === s.id ? ' on' : '');
    b.textContent = s.n + ' ' + s.c;
    b.onclick = () => selectStop(s);
    box.appendChild(b);
  }
}

function selectStop(s){
  state.stop = s; LS.set('kt_stop', s);
  renderFavs(); renderStopHead(); loadDeps();
}

function renderStopHead(){
  const h = document.getElementById('stopHead');
  const s = state.stop;
  if(!s){ h.innerHTML = '<div class="muted">Wyszukaj przystanek, a potem dodaj go gwiazdką do ulubionych.</div>'; return }
  const fav = state.favs.some(f => f.id === s.id);
  h.innerHTML = `<b style="flex:1">${s.n} ${s.c}</b><button class="star">${fav?'★':'☆'}</button>`;
  h.querySelector('.star').onclick = () => {
    state.favs = fav ? state.favs.filter(f => f.id !== s.id) : [...state.favs, s];
    LS.set('kt_favs', state.favs); renderFavs(); renderStopHead();
  };
}

// ---------- odjazdy ----------
const hhmm = d => d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});

async function loadDeps(){
  const s = state.stop; if(!s) return;
  const box = document.getElementById('deps'), info = document.getElementById('depInfo');
  try{
    const data = await getJSON(API.deps(s.id));
    const list = data.departures || (data[s.id] && data[s.id].departures) || [];
    state.stopLines = [...new Set(list.map(d => String(d.routeShortName)))];
    renderStopAlerts();
    box.innerHTML = '';
    if(!list.length){ box.innerHTML = '<div class="muted">Brak odjazdów w najbliższym czasie.</div>' }
    const now = Date.now();
    for(const d of list.slice(0, 20)){
      const t = new Date(d.estimatedTime || d.theoreticalTime);
      const min = Math.round((t - now) / 60000);
      const vi = d.vehicleCode != null ? vInfo(d.vehicleCode) : null;
      const isTram = vi ? vi.v.type === 'Tramwaj' : Number(d.routeShortName) < 20;
      const delay = d.delayInSeconds != null ? Math.round(d.delayInSeconds/60) : null;
      let veh;
      if(vi){
        veh = `<span class="mdl" style="background:${vi.c.color}">${vi.label}</span>#${d.vehicleCode}${vi.v.ac?' · klima':''}`;
      } else if(d.vehicleCode != null){
        veh = '#' + d.vehicleCode;
      } else {
        veh = 'wóz jeszcze nieznany (rozkład)';
      }
      const el = document.createElement('div');
      el.className = 'item';
      el.innerHTML = `<span class="ln ${isTram?'':'bus'}">${d.routeShortName}</span>
        <div class="hd"><b>${d.headsign || ''}</b><small>${veh}</small></div>
        <div class="tm">${min <= 0 ? 'teraz' : min + ' min'}<small>${hhmm(t)}${delay ? (delay>0?' +':' ')+delay : ''}</small></div>`;
      box.appendChild(el);
    }
    info.textContent = 'aktualizacja ' + hhmm(new Date()) + ' · co 20 s' + routeLabel('https://ckan2.multimediagdansk.pl/departures');
  }catch(e){
    box.innerHTML = '<div class="err">' + corsHint(e) + '</div>';
  }
}

// ---------- mapa ----------
let map, layer;
function initMap(){
  map = L.map('map', {zoomControl:false}).setView([54.37, 18.62], 12);
  // OpenStreetMap; jeden adres zamiast starych poddomen a/b/c (zalecane przez OSM, szybsze po HTTP/2)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, keepBuffer: 4, updateWhenIdle: false, updateWhenZooming: false,
    attribution: '© OpenStreetMap'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
  // podczas przesuwania palcem nie przerysowujemy tramwajów, robimy to po puszczeniu
  map.on('movestart', () => { state.moving = true });
  map.on('moveend', () => { state.moving = false; if(state.pendingGps){ const d = state.pendingGps; state.pendingGps = null; drawGps(d) } });
  // gdy zmienia się wysokość ekranu (np. chowa się pasek adresu), mapa musi przeliczyć swój rozmiar
  try{ new ResizeObserver(() => map.invalidateSize({pan:false})).observe(document.getElementById('map')) }catch(e){}
  window.addEventListener('resize', () => map.invalidateSize({pan:false}));
  let lastDetail = null;
  map.on('zoomend', () => {
    const z = map.getZoom(), d = z >= 15 ? 2 : z >= 14 ? 1 : 0;
    if(d !== lastDetail && lastGps){ lastDetail = d; drawGps(lastGps) }
  });
  const box = document.getElementById('mFilter');
  for(const m of MODELS){
    const b = document.createElement('button');
    b.className = 'chip' + (state.mapModels.includes(m.key) ? ' on' : '');
    b.style.borderLeft = '4px solid ' + m.color;
    b.textContent = m.name;
    b.onclick = () => {
      state.mapModels = state.mapModels.includes(m.key) ? state.mapModels.filter(k => k !== m.key) : [...state.mapModels, m.key];
      LS.set('kt_mapModels', state.mapModels);
      b.classList.toggle('on'); if(lastGps) drawGps(lastGps); else loadGps();
    };
    box.appendChild(b);
  }
}

let lastGps = null;
function tramLabel(g, vi){
  const z = map.getZoom();
  const moving = g.speed > 0 || g.direction;
  const arrow = moving ? `<i style="transform:rotate(${g.direction||0}deg)">▲</i>` : '';
  let head = (g.headsign || 'zjazd').replace(/\s*PKM$/,'');
  if(head.length > 16) head = head.slice(0, 15) + '…';
  const delay = g.delay != null ? Math.round(g.delay/60) : 0;
  let html = arrow + '<b>' + (g.routeShortName || '–') + '</b>';
  if(z >= 14) html += '<small>' + head + '</small>';
  if(z >= 15) html += '<small>· ' + vi.label + (delay >= 2 ? ' · +' + delay : '') + '</small>';
  return `<div class="tram" style="background:${vi.c.color}">${html}</div>`;
}

async function loadGps(){
  if(!map) return;
  const info = document.getElementById('mapInfo');
  try{
    const data = await getJSON(API.gps);
    lastGps = data;
    drawGps(data);
  }catch(e){
    info.textContent = corsHint(e);
  }
}

const markers = new Map();   // numer taborowy -> {m, html, g, vi}
function popupHtml(g, vi){
  const v = vi.v, delay = g.delay != null ? Math.round(g.delay/60) : null;
  return `<b>${g.routeShortName || '?'} → ${g.headsign || 'zjazd / brak kursu'}</b><br>
    <span class="mdl" style="background:${vi.c.color}">${vi.label}</span> #${g.vehicleCode}<br>
    ${v.brand || ''} ${v.model || ''}, ${v.year || '?'}<br>
    miejsca: ${v.seats ?? '?'} siedz. / ${v.stand ?? '?'} stoj.<br>
    ${v.ac ? 'klimatyzacja' : 'bez klimatyzacji'} · ${(v.floor || '').replace('Pojazd ','')}<br>
    ${delay != null ? 'opóźnienie: ' + delay + ' min' : ''}`;
}
function drawGps(data){
  if(state.moving){ state.pendingGps = data; return }
  const info = document.getElementById('mapInfo');
  const seen = new Set();
  let n = 0;
  for(const g of data.vehicles || []){
    const vi = vInfo(g.vehicleCode);
    if(!vi || vi.v.type !== 'Tramwaj') continue;
    if(!state.mapModels.includes(vi.c.key)) continue;
    n++;
    const code = String(g.vehicleCode);
    seen.add(code);
    const html = tramLabel(g, vi);
    let rec = markers.get(code);
    if(!rec){
      const m = L.marker([g.lat, g.lon], {icon: L.divIcon({className:'', iconSize:[0,0], iconAnchor:[0,0], html})}).addTo(layer);
      rec = {m, html};
      // treść kartki tworzona dopiero po kliknięciu
      m.bindPopup(() => popupHtml(rec.g, rec.vi));
      markers.set(code, rec);
    }else{
      const ll = rec.m.getLatLng();
      if(ll.lat !== g.lat || ll.lng !== g.lon) rec.m.setLatLng([g.lat, g.lon]);
      if(rec.html !== html){ rec.m.setIcon(L.divIcon({className:'', iconSize:[0,0], iconAnchor:[0,0], html})); rec.html = html }
    }
    rec.g = g; rec.vi = vi;
  }
  for(const [code, rec] of markers){
    if(!seen.has(code)){ layer.removeLayer(rec.m); markers.delete(code) }
  }
  const age = Math.round((Date.now() - new Date(data.lastUpdate)) / 60000);
  info.textContent = n + ' tramwajów · stan z ' + hhmm(new Date(data.lastUpdate)) + (age >= 2 ? ' (sprzed ' + age + ' min!)' : '') + ' · co 15 s' + routeLabel('https://ckan2.multimediagdansk.pl/gpsPositions');
}

// ---------- komunikaty ZTM ----------
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isTramLine = l => /^T?\d{1,2}$/.test(l) && parseInt(l.replace('T','')) < 20;
const ztmDate = t => t ? new Date(t.replace(' ', 'T')) : null;
const dayStr = d => d.toLocaleDateString('pl-PL', {day:'numeric', month:'numeric'}) + ' ' + hhmm(d);
state.alerts = [];
state.infoMode = 'tram';
state.stopLines = [];

function cleanHtml(html){
  // treść z ZTM to HTML z Worda: zostawiamy sam tekst akapitów i punktów
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const out = [];
  doc.body.querySelectorAll('p, li, h1, h2, h3, h4').forEach(el => {
    if(el.querySelector('p, li')) return;
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if(t) out.push('<p>' + (el.tagName === 'LI' ? '• ' : '') + esc(t) + '</p>');
  });
  if(!out.length){ const t = doc.body.textContent.trim(); if(t) out.push('<p>' + esc(t) + '</p>') }
  return out.join('');
}

async function loadAlerts(){
  state.alertsLoading = true;
  const [b, z] = await Promise.allSettled([getJSON(API.bsk, 10000), getJSON(API.znt, 10000)]);
  state.alertsLoading = false;
  const now = new Date(), seen = new Set(), list = [];
  const add = (r, kind) => {
    for(const x of (r.status === 'fulfilled' && r.value.results) || []){
      if(seen.has(x.url || x.title)) continue;
      const from = ztmDate(x.publishFrom), to = ztmDate(x.publishTo);
      if(from && from > now) continue;
      if(to && to < now) continue;
      seen.add(x.url || x.title);
      list.push({kind, lines: x.lineNumbers || [], title: x.title, summary: x.summary, body: cleanHtml(x.content),
        url: x.url, from, alarmFrom: ztmDate(x.alarmDateFrom), alarmTo: ztmDate(x.alarmDateTo)});
      // ZTM długo trzyma stare komunikaty; te po okresie wyróżnienia albo sprzed 14 dni idą na dół jako starsze
      const a = list[list.length - 1];
      a.old = kind !== 'now' && (a.alarmTo ? a.alarmTo < now : (a.from && now - a.from > 14 * 864e5));
    }
  };
  add(b, 'now'); add(z, 'route');
  if(b.status === 'rejected' && z.status === 'rejected'){ state.alertsErr = b.reason.message; return renderAlerts() }
  state.alertsErr = '';
  list.sort((a, c) => (a.old ? 1 : 0) - (c.old ? 1 : 0) || (a.kind === 'now' ? 0 : 1) - (c.kind === 'now' ? 0 : 1) || (c.from || 0) - (a.from || 0));
  state.alerts = list;
  state.alertsAt = now;
  renderAlerts(); renderStopAlerts();
}

function alertsFor(mode){
  if(mode === 'now') return state.alerts.filter(a => a.kind === 'now');
  if(mode === 'all') return state.alerts.filter(a => a.kind !== 'now');
  if(mode === 'stop') return state.alerts.filter(a => a.kind !== 'now' && a.lines.some(l => state.stopLines.includes(l)));
  return state.alerts.filter(a => a.kind !== 'now' && a.lines.some(isTramLine));
}

function alertCard(a, i){
  const lines = a.lines.map(l => `<span class="ln ${isTramLine(l) ? '' : 'bus'}">${esc(l)}</span>`).join('');
  const when = a.alarmFrom ? 'od ' + dayStr(a.alarmFrom) + (a.alarmTo ? ' do ' + dayStr(a.alarmTo) : '')
    : a.from ? (a.kind === 'now' ? 'od ' : 'opublikowano ') + dayStr(a.from) : '';
  return `<div class="alert ${a.kind}${a.old ? ' old' : ''}">
    <div class="lns">${lines}<span class="kind">${a.kind === 'now' ? 'utrudnienie' : 'zmiana trasy'}${a.old ? ' · starszy' : ''}</span></div>
    <h3>${esc(a.title)}</h3>
    <div class="meta">${when} · stuknij, aby rozwinąć</div>
    <div class="body">${a.body || esc(a.summary || '')}${a.url ? `<p><a href="${esc(a.url)}" target="_blank" rel="noopener">Pełny komunikat na ztm.gda.pl</a></p>` : ''}</div>
  </div>`;
}

function renderAlerts(){
  const now = alertsFor('now');
  const tram = alertsFor('tram').filter(a => !a.old).length;
  const btn = document.getElementById('tInfo');
  document.getElementById('infoCount').textContent = now.length ? now.length : tram ? tram : '';
  btn.classList.toggle('hot', now.length > 0);

  const nowBox = document.getElementById('infoNow');
  if(!state.alertsAt && !state.alertsErr) nowBox.innerHTML = '';
  else nowBox.innerHTML = '<div class="sect">Bieżąca sytuacja komunikacyjna</div>' +
    (now.length ? now.map(alertCard).join('') : '<div class="okline">Brak awarii i nagłych zmian tras.</div>') +
    '<div class="sect">Komunikaty i zmiany tras</div>';

  const f = document.getElementById('infoFilter');
  const modes = [['tram', 'Tramwaje'], ...(state.stop ? [['stop', state.stop.n + ' ' + state.stop.c]] : []), ['all', 'Wszystkie']];
  if(state.infoMode === 'now') state.infoMode = 'tram';
  f.innerHTML = '';
  for(const [k, label] of modes){
    const b = document.createElement('button');
    b.className = 'chip' + (state.infoMode === k ? ' on' : '');
    b.textContent = label + ' (' + alertsFor(k).length + ')';
    b.onclick = () => { state.infoMode = k; renderAlerts() };
    f.appendChild(b);
  }
  const box = document.getElementById('infoList');
  const items = alertsFor(state.infoMode);
  if(!state.alertsAt && !state.alertsErr) box.innerHTML = '<div class="muted">Wczytuję komunikaty ZTM…</div>';
  else if(state.alertsErr) box.innerHTML = '<div class="err">Nie udało się pobrać komunikatów (' + esc(state.alertsErr) + ').</div>';
  else if(!items.length) box.innerHTML = '<div class="muted">Brak komunikatów w tej grupie.</div>';
  else box.innerHTML = items.map(alertCard).join('');
  document.querySelectorAll('#infoView .alert').forEach(el => el.addEventListener('click', e => {
    if(e.target.closest('a')) return;
    el.classList.toggle('open');
  }));
  document.getElementById('infoMeta').textContent = state.alertsAt ? 'komunikaty z ' + hhmm(state.alertsAt) + ' · bieżąca sytuacja co 2 min' : '';
}

function renderStopAlerts(){
  const box = document.getElementById('stopAlerts');
  const hits = a => a.lines.some(l => state.stopLines.includes(l));
  const now = alertsFor('now').filter(a => hits(a) || a.lines.some(isTramLine));
  const rel = alertsFor('stop').filter(a => !a.old);
  let html = '';
  for(const a of now) html += `<div class="stopAlert now" data-go="1">⚠ <b>${esc(a.title)}</b> · <u>szczegóły</u></div>`;
  if(rel.length){
    const lines = [...new Set(rel.flatMap(a => a.lines).filter(l => state.stopLines.includes(l)))];
    html += `<div class="stopAlert" data-go="1">ℹ ${rel.length === 1 ? 'Komunikat' : rel.length + ' komunikaty'} dla linii ${lines.map(esc).join(', ')} · <u>pokaż</u></div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { state.infoMode = 'stop'; tab('info') });
}

// ---------- zakładki i start ----------
function tab(which){
  document.getElementById('tStop').classList.toggle('on', which==='stop');
  document.getElementById('tMap').classList.toggle('on', which==='map');
  document.getElementById('tInfo').classList.toggle('on', which==='info');
  document.getElementById('infoView').classList.toggle('on', which==='info');
  if(which==='info') renderAlerts();
  document.getElementById('stopView').classList.toggle('on', which==='stop');
  document.getElementById('mapView').classList.toggle('on', which==='map');
  if(which==='map'){ if(!map) initMap(); setTimeout(() => map.invalidateSize(), 50); loadGps() }
}
document.getElementById('tStop').onclick = () => tab('stop');
document.getElementById('tMap').onclick = () => tab('map');
document.getElementById('tInfo').onclick = () => tab('info');
document.getElementById('tSet').onclick = () => { document.getElementById('proxy').value = state.proxy; document.getElementById('dlg').showModal() };
document.getElementById('dlgOk').onclick = () => {
  state.proxy = document.getElementById('proxy').value.trim();
  LS.set('kt_proxy', state.proxy);
  document.getElementById('dlg').close();
  start();
};
document.getElementById('q').addEventListener('input', renderResults);

async function retryStops(){
  try{ await loadStops(); state.stopsErr = ''; renderResults() }
  catch(e){ state.stopsErr = e.message; setTimeout(retryStops, 60000) }
}

async function start(){
  const info = document.getElementById('depInfo');
  info.textContent = 'Ładowanie bazy pojazdów i przystanków…';
  loadAlerts();
  const [f, st] = await Promise.allSettled([loadFleet(), loadStops()]);
  info.textContent = '';
  state.stopsErr = st.status === 'rejected' ? st.reason.message : '';
  renderResults();
  if(f.status === 'rejected') document.getElementById('deps').innerHTML = '<div class="err">Baza pojazdów: ' + corsHint(f.reason) + '</div>';
  renderFavs(); renderStopHead(); loadDeps();
  if(state.stopsErr) setTimeout(retryStops, 30000);
}

setInterval(() => { if(document.visibilityState==='visible' && document.getElementById('stopView').classList.contains('on')) loadDeps() }, 20000);
setInterval(() => { if(document.visibilityState==='visible') loadAlerts() }, 2 * 60000);
setInterval(() => { if(document.visibilityState==='visible' && map && document.getElementById('mapView').classList.contains('on')) loadGps() }, 15000);
try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {scope: './'}) }catch(e){}
start();
</script>
